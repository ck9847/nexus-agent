spring:
  application:
    name: nexus-agent

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:nexus_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:nexus_app}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 压测与生产基线：池上限与获取超时显式化（Hikari 属性为
      # 毫秒数值），配合 hikaricp_* 指标观测连接池利用率与等待。
      maximum-pool-size: ${NEXUS_HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${NEXUS_HIKARI_MIN_IDLE:5}
      connection-timeout: ${NEXUS_HIKARI_CONNECTION_TIMEOUT_MS:5000}
      max-lifetime: ${NEXUS_HIKARI_MAX_LIFETIME_MS:1800000}
      pool-name: nexus-hikari

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  jackson:
    time-zone: UTC

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-}|%X{traceId:-}] %logger{40} - %msg%n"

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  metrics:
    distribution:
      # Prometheus 的 histogram_quantile 依赖 *_bucket。只对三个
      # 低基数核心 Timer 开启直方图，避免无边界地增加时序数量。
      percentiles-histogram:
        http.server.requests: true
        nexus.conversation.turn: true
        nexus.model.call: true
        nexus.conversation.turn.queue.wait: true
      minimum-expected-value:
        http.server.requests: 1ms
        nexus.conversation.turn: 10ms
        nexus.model.call: 10ms
        nexus.conversation.turn.queue.wait: 1ms
      maximum-expected-value:
        http.server.requests: 10s
        nexus.conversation.turn: 2m
        nexus.model.call: 2m
        nexus.conversation.turn.queue.wait: 30s
      slo:
        http.server.requests: 10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s,10s
        nexus.conversation.turn: 100ms,250ms,500ms,1s,2s,5s,10s,30s,1m,2m
        nexus.model.call: 100ms,250ms,500ms,1s,2s,5s,10s,30s,1m,2m
        nexus.conversation.turn.queue.wait: 1ms,5ms,10ms,50ms,100ms,500ms,1s,5s,10s

  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true

info:
  application:
    name: NexusAgent
    version: 0.1.0

nexus:
  id:
    node-id: ${NEXUS_ID_NODE_ID:0}

  security:
    bcrypt-strength: ${NEXUS_BCRYPT_STRENGTH:12}

    jwt:
      issuer: ${NEXUS_JWT_ISSUER:https://auth.nexus-agent.local}
      secret: ${NEXUS_JWT_SECRET}
      access-token-ttl: ${NEXUS_JWT_ACCESS_TOKEN_TTL:15m}
  model:
    openai:
      enabled: ${NEXUS_OPENAI_ENABLED:false}
      base-url: ${NEXUS_OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      connect-timeout: ${NEXUS_OPENAI_CONNECT_TIMEOUT:10s}
      read-timeout: ${NEXUS_OPENAI_READ_TIMEOUT:2m}
      max-error-body-bytes: ${NEXUS_OPENAI_MAX_ERROR_BODY_BYTES:8192}
  conversation:
    streaming:
      timeout: ${NEXUS_CONVERSATION_STREAM_TIMEOUT:2m}
      core-pool-size: ${NEXUS_CONVERSATION_STREAM_CORE_POOL_SIZE:4}
      max-pool-size: ${NEXUS_CONVERSATION_STREAM_MAX_POOL_SIZE:16}
      queue-capacity: ${NEXUS_CONVERSATION_STREAM_QUEUE_CAPACITY:100}

  resilience:
    rate-limit:
      enabled: ${NEXUS_RATE_LIMIT_ENABLED:true}
      tenant-limit-for-period: ${NEXUS_RATE_LIMIT_TENANT_LIMIT:60}
      tenant-refresh-period: ${NEXUS_RATE_LIMIT_TENANT_REFRESH:10s}
      user-limit-for-period: ${NEXUS_RATE_LIMIT_USER_LIMIT:6}
      user-refresh-period: ${NEXUS_RATE_LIMIT_USER_REFRESH:10s}

    circuit-breaker:
      sliding-window-size: ${NEXUS_CIRCUIT_BREAKER_WINDOW:20}
      minimum-number-of-calls: ${NEXUS_CIRCUIT_BREAKER_MIN_CALLS:20}
      failure-rate-threshold: ${NEXUS_CIRCUIT_BREAKER_FAILURE_RATE:50}
      wait-duration-in-open-state: ${NEXUS_CIRCUIT_BREAKER_WAIT:30s}
      permitted-number-of-calls-in-half-open-state: ${NEXUS_CIRCUIT_BREAKER_HALF_OPEN:3}

    model-retry:
      max-attempts: ${NEXUS_MODEL_RETRY_MAX_ATTEMPTS:3}
      initial-backoff: ${NEXUS_MODEL_RETRY_INITIAL_BACKOFF:200ms}
      backoff-multiplier: ${NEXUS_MODEL_RETRY_BACKOFF_MULTIPLIER:4}

  observability:
    metrics-scrape:
      enabled: ${NEXUS_METRICS_SCRAPE_ENABLED:false}
      username: ${NEXUS_METRICS_USERNAME:prometheus}
      password: ${NEXUS_METRICS_PASSWORD:}
