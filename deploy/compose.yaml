name: nexus-agent

services:
  mysql:
    image: mysql:8.4
    container_name: nexus-agent-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: UTC

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00

    ports:
      - "${MYSQL_PORT:-3307}:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

    networks:
      - nexus-network

  app:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nexus-agent-app
    restart: unless-stopped
    stop_grace_period: 30s

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      # MySQL 连接：容器内通过服务名访问。
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      # JWT（密钥通过环境变量注入，绝不写入本文件）。
      NEXUS_JWT_ISSUER: ${NEXUS_JWT_ISSUER:-https://auth.nexus-agent.local}
      NEXUS_JWT_SECRET: ${NEXUS_JWT_SECRET:?NEXUS_JWT_SECRET is required}
      NEXUS_JWT_ACCESS_TOKEN_TTL: ${NEXUS_JWT_ACCESS_TOKEN_TTL:-15m}

      # OpenAI 模型网关（密钥通过环境变量注入，绝不写入本文件）。
      NEXUS_OPENAI_ENABLED: ${NEXUS_OPENAI_ENABLED:-false}
      NEXUS_OPENAI_BASE_URL: ${NEXUS_OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEXUS_OPENAI_CONNECT_TIMEOUT: ${NEXUS_OPENAI_CONNECT_TIMEOUT:-10s}
      NEXUS_OPENAI_READ_TIMEOUT: ${NEXUS_OPENAI_READ_TIMEOUT:-2m}
      NEXUS_OPENAI_MAX_ERROR_BODY_BYTES: ${NEXUS_OPENAI_MAX_ERROR_BODY_BYTES:-8192}

      # 会话流式线程池与超时。
      NEXUS_CONVERSATION_STREAM_TIMEOUT: ${NEXUS_CONVERSATION_STREAM_TIMEOUT:-2m}
      NEXUS_CONVERSATION_STREAM_CORE_POOL_SIZE: ${NEXUS_CONVERSATION_STREAM_CORE_POOL_SIZE:-4}
      NEXUS_CONVERSATION_STREAM_MAX_POOL_SIZE: ${NEXUS_CONVERSATION_STREAM_MAX_POOL_SIZE:-16}
      NEXUS_CONVERSATION_STREAM_QUEUE_CAPACITY: ${NEXUS_CONVERSATION_STREAM_QUEUE_CAPACITY:-100}

      # 可选：ID 节点与密码哈希强度。
      NEXUS_ID_NODE_ID: ${NEXUS_ID_NODE_ID:-0}
      NEXUS_BCRYPT_STRENGTH: ${NEXUS_BCRYPT_STRENGTH:-12}

      # 指标抓取专用身份（observability profile：Prometheus 抓取
      # /actuator/prometheus 的 HTTP Basic 凭据，密码绝不写入本文件）。
      NEXUS_METRICS_SCRAPE_ENABLED: ${NEXUS_METRICS_SCRAPE_ENABLED:-false}
      NEXUS_METRICS_USERNAME: ${NEXUS_METRICS_USERNAME:-prometheus}
      NEXUS_METRICS_PASSWORD: ${NEXUS_METRICS_PASSWORD:-}

    ports:
      - "${SERVER_PORT:-8080}:8080"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

    networks:
      - nexus-network

  # ---------------------------------------------------------------------
  # Observability（`--profile observability` 启用）
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: nexus-agent-prometheus
    restart: unless-stopped

    profiles:
      - observability

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d

    # 只绑定本机，不对外网暴露。
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

    volumes:
      # 配置只读挂载；抓取密码文件来自 secrets 目录（不进 Git，
      # 部署约定见 observability/README.md）。secrets 挂到
      # /run/secrets 而不是 /etc/prometheus 的子目录：
      # 只读父挂载下无法创建嵌套挂载点。
      - ./observability/prometheus:/etc/prometheus:ro
      - ./secrets:/run/secrets:ro
      - prometheus-data:/prometheus

    # 通过 compose 内网（nexus-network）以服务名抓取 app。
    depends_on:
      app:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

    networks:
      - nexus-network

  grafana:
    image: grafana/grafana:13.1.3
    container_name: nexus-agent-grafana
    restart: unless-stopped

    profiles:
      - observability

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Grafana 官方镜像支持 __FILE，从只读 secret 读取管理员密码；
      # 不提供任何可工作的默认密码。
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"

    # 只绑定本机，不对外网暴露。
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

    volumes:
      # provisioning 与 dashboard 配置只读挂载。
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./secrets:/run/secrets:ro
      - grafana-data:/var/lib/grafana

    # 数据源 http://prometheus:9090 经 compose 内网解析。
    depends_on:
      prometheus:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

    networks:
      - nexus-network

volumes:
  mysql-data:
    name: nexus-agent-mysql-data

  prometheus-data:
    name: nexus-agent-prometheus-data

  grafana-data:
    name: nexus-agent-grafana-data

networks:
  nexus-network:
    name: nexus-agent-network
