# 公网演示环境栈：拉取已发布镜像运行（不在服务器上构建）。
#
# 使用：在服务器上准备 .env（见 README.md），然后
#   docker compose -f compose.demo.yaml --profile edge up -d
# 有域名时启用 edge profile（Caddy 自动 TLS）；
# 无域名时去掉 --profile edge，直接以 80 端口暴露 app。
name: nexus-agent-demo

services:
  mysql:
    image: mysql:8.4
    container_name: nexus-demo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DEMO_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: nexus_agent
      MYSQL_USER: nexus_app
      MYSQL_PASSWORD: ${DEMO_MYSQL_PASSWORD}
    volumes:
      - demo-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -pnexus_app --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - demo-network

  app:
    image: ${DEMO_IMAGE:-ghcr.io/ck9847/nexus-agent:0.1.0}
    container_name: nexus-demo-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    stop_grace_period: 30s
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: nexus_agent
      MYSQL_USER: nexus_app
      MYSQL_PASSWORD: ${DEMO_MYSQL_PASSWORD}
      SERVER_PORT: 8080
      NEXUS_JWT_SECRET: ${DEMO_JWT_SECRET}
      NEXUS_JWT_ACCESS_TOKEN_TTL: 30m
      # 演示环境启用内置演示模型网关配置开关（默认关闭外部调用）；
      # 由 .env 提供真实供应商配置时才会发起外部模型调用。
      NEXUS_OPENAI_ENABLED: ${DEMO_OPENAI_ENABLED:-false}
      NEXUS_OPENAI_BASE_URL: ${DEMO_OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${DEMO_OPENAI_API_KEY:-}
      # 公网演示的限流收紧：单用户 6 次/10s。
      NEXUS_RATE_LIMIT_USER_LIMIT: 6
      NEXUS_RATE_LIMIT_USER_REFRESH: 10s
    networks:
      - demo-network

  # 可选：有域名时的自动 TLS 反向代理。
  caddy:
    image: caddy:2-alpine
    container_name: nexus-demo-caddy
    profiles:
      - edge
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    command: >-
      sh -c "echo '${DEMO_DOMAIN} {
        reverse_proxy app:8080
      }' > /etc/caddy/Caddyfile && caddy run --config /etc/caddy/Caddyfile"
    volumes:
      - demo-caddy-data:/data
      - demo-caddy-config:/config
    networks:
      - demo-network

volumes:
  demo-mysql-data:
  demo-caddy-data:
  demo-caddy-config:

networks:
  demo-network:
    name: nexus-demo-network
